name: Bug 报告
description: 提交一个 Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽量详细描述问题，以便我们快速定位和修复。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 门户首页
        - 登录 / 验证码
        - 后台 - 用户管理
        - 后台 - 审计日志
        - 后台 - 门户设置
        - 文件上传
        - 部署 / 构建
        - 其他 / 不确定
    validations:
      required: true

  # 本项目在 Serverless 与长进程下有若干行为差异（文件存储、限流后端、
  # 响应后异步任务的保活方式），不知道运行环境往往没法判断问题成因。
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - 本地开发（pnpm dev）
        - Vercel
        - 自建服务器（Docker + Nginx）
        - 其他
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      description: 仅前端问题需要填写
      options:
        - 不涉及 / 服务端问题
        - Chrome
        - Firefox
        - Safari
        - Edge
        - 移动端浏览器
        - 其他

  - type: input
    id: version
    attributes:
      label: 版本
      description: commit hash 或 tag（Docker 部署可在部署目录的 build_info.sh 中查看）
      placeholder: 例如 f024bd7 或 v1.0.0

  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      description: |
        服务端日志或浏览器控制台输出。
        请注意先脱敏：不要粘贴 DATABASE_URL、BETTER_AUTH_SECRET、OSS 密钥、
        session cookie 等敏感内容。
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如有相关截图，请在此上传
