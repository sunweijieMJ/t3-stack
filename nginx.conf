# 默认仅 HTTP 入口（阿里云 ECS 等无 SSL 场景；AWS 部署会额外叠加 nginx.https.conf）
# 注意：HTTPS 模式下本文件仍然生效，80 端口同样直通业务而非强制 301 —
#       因为强制跳转写法会与 https.conf 的 80 server 块冲突（同端口同 server_name）。
#       HTTPS 模式下浏览器 HSTS 由 443 server 块的 Strict-Transport-Security 头负责。
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Docker 内部 DNS（解析 organova-app 容器主机名）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js 构建产物 - 长期缓存
    location ^~ /_next/static/ {
        alias /usr/share/nginx/static/;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 上传文件
    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # public 目录静态资源
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|mp4|webm|woff2?|ttf|eot)$ {
        root /usr/share/nginx/public;
        try_files $uri @nextjs;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 健康检查直通（独立 location，避免被业务代理逻辑影响）
    location = /api/health {
        set $upstream http://organova-app:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    set $upstream http://organova-app:3000;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @nextjs {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
