# 默认仅 HTTP 入口（阿里云 ECS 等无 SSL 场景；AWS 部署会额外叠加 nginx.https.conf）
# 注意：HTTPS 模式下本文件仍然生效，80 端口同样直通业务而非强制 301 —
#       因为强制跳转写法会与 https.conf 的 80 server 块冲突（同端口同 server_name）。
#       HTTPS 模式下浏览器 HSTS 由 443 server 块的 Strict-Transport-Security 头负责。
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Docker 内部 DNS（解析 organova-app 容器主机名）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── 安全头 ──
    # 只保留 nginx 直出静态文件时需要的那部分（下面各 location 里单独声明）。
    # 应用响应（HTML / API）的安全头统一由 next.config.js 的 headers() 下发 ——
    # 那份定义同时覆盖 Vercel、Docker、`next dev` 三种跑法，是唯一事实源。
    # 这里不再重复声明：nginx 的 add_header 会叠加到上游响应上，
    # 结果是 `X-Frame-Options: SAMEORIGIN, SAMEORIGIN` 这种重复头。
    #
    # X-XSS-Protection 一并删除：这个头早已被各主流浏览器废弃（Chrome 78+ 移除），
    # 且历史上其 filter 本身引入过跨站泄漏漏洞，现代做法是靠 CSP。

    # Next.js 构建产物 - 长期缓存
    location ^~ /_next/static/ {
        alias /usr/share/nginx/static/;
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 上传文件
    # 用 root 而非 alias：/uploads/x → /usr/share/nginx/uploads/x（映射结果与 alias 相同），
    # 但 root 能被下面的嵌套 location 正确继承语义，alias 在嵌套 location 里会失效。
    location ^~ /uploads/ {
        root /usr/share/nginx;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # PDF 强制下载，与 OSS 分支行为对齐。
        # STORAGE_PROVIDER=local（默认值）时文件由 nginx 直接静态服务，
        # /api/upload 传给 storage 的 downloadName 落不到任何响应头上，
        # 只有在这里补 Content-Disposition 才能真正避免浏览器内联渲染 PDF。
        # 注意：add_header 不会从父块继承，命中本块后上面那几个头会全部失效，
        # 所以必须逐条重申。
        location ~* \.pdf$ {
            root /usr/share/nginx;
            expires 30d;
            add_header Cache-Control "public" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Disposition "attachment" always;
            access_log off;
        }
    }

    # public 目录静态资源
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|mp4|webm|woff2?|ttf|eot)$ {
        root /usr/share/nginx/public;
        try_files $uri @nextjs;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 健康检查直通（独立 location，避免被业务代理逻辑影响）
    # 转发头必须与下面 location / 保持一致：proxy_set_header 不从父块继承，
    # 独立 location 里漏掉 X-Real-IP 会让该路径的 getClientIp 恒为 'unknown'。
    # （限流本身已在 proxy.ts 里对本路径豁免，这里补齐是为了访问日志与排查时能看到真实来源。）
    location = /api/health {
        set $upstream http://organova-app:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    set $upstream http://organova-app:3000;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @nextjs {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
